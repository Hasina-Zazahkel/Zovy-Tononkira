<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zovy Tononkira — démo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #060504; color: #e9e3d6; font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
  .bar { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid #2a2418; background: #0d0b08; }
  .bar b { color: #ffc000; letter-spacing: .08em; margin-right: auto; font-size: 14px; }
  .bar button { height: 38px; padding: 0 14px; border-radius: 999px; border: 2px solid #3a3222; background: none; color: #bdb5a3; font: 700 14px system-ui; cursor: pointer; }
  .bar button.on { background: #ffc000; border-color: #ffc000; color: #111; }
  .bar .dim { color: #7d7564; font-size: 13px; min-width: 120px; text-align: right; }
  .stage { position: absolute; inset: 56px 0 0 0; display: grid; place-items: center; }
  .device { position: absolute; top: 50%; left: 50%; transform-origin: center; border-radius: 36px; padding: 18px; background: #1b1914; box-shadow: 0 0 0 2px #3a3428, 0 30px 80px rgba(0,0,0,.7); }
  .device.pc { border-radius: 10px; padding: 0; box-shadow: 0 0 0 1px #3a3428, 0 30px 80px rgba(0,0,0,.7); }
  .device.full { inset: 0; top: 0; left: 0; transform: none !important; border-radius: 0; padding: 0; box-shadow: none; width: 100% !important; height: 100% !important; }
  iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 20px; background: #0b0a08; }
  .device.pc iframe, .device.full iframe { border-radius: 0; }
</style>
</head>
<body>
  <div class="bar">
    <b>ZOVY · DÉMO</b>
    <button data-v="tablette">Tablette</button>
    <button data-v="smartphone">Smartphone</button>
    <button data-v="pc">PC</button>
    <button data-v="full">Plein cadre</button>
    <span class="dim" id="dim"></span>
  </div>
  <div class="stage" id="stage">
    <div class="device" id="device"><iframe id="app" src="app.html" title="Zovy Tononkira"></iframe></div>
  </div>
<script>
  const SIZES = { tablette: [800, 1280], smartphone: [412, 915], pc: [1440, 900] };
  const dev = document.getElementById('device'), stage = document.getElementById('stage'), dim = document.getElementById('dim');
  let view = 'tablette';
  try { view = localStorage.getItem('zovy.demo.view') || view; } catch (e) {}
  function layout() {
    document.querySelectorAll('.bar button').forEach((b) => b.classList.toggle('on', b.dataset.v === view));
    dev.className = 'device' + (view === 'pc' ? ' pc' : '') + (view === 'full' ? ' full' : '');
    if (view === 'full') { dev.style.width = dev.style.height = ''; dim.textContent = `${stage.clientWidth} × ${stage.clientHeight}`; return; }
    const [w, h] = SIZES[view], pad = view === 'pc' ? 0 : 36;
    dev.style.width = (w + pad) + 'px'; dev.style.height = (h + pad) + 'px';
    const s = Math.min((stage.clientWidth - 24) / (w + pad), (stage.clientHeight - 24) / (h + pad), 1);
    dev.style.transform = `translate(-50%, -50%) scale(${s})`;
    dim.textContent = `${w} × ${h}` + (s < 1 ? ` · ${Math.round(s * 100)} %` : '');
  }
  document.querySelectorAll('.bar button').forEach((b) => b.addEventListener('click', () => {
    view = b.dataset.v;
    try { localStorage.setItem('zovy.demo.view', view); } catch (e) {}
    layout();
  }));
  addEventListener('resize', layout);
  layout();
</script>
</body>
</html>
